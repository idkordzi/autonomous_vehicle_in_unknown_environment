/av_planner_node:
    ros__parameters:
        ros_node:
            subs:
                vision_cloud: "/robot/vision/cloud"
                vision_target: "/robot/vision/target"
                robot_pose: "/robot/ekf/pose"
                robot_velocity: "/robot/ekf/velocity"
            pubs:
                planner_goal: "/robot/planner/goal"
                planner_image_histogram: "/robot/planner/image/histogram"
                planner_image_cost: "/robot/planner/image/cost"
            thread_freq: 5.0
        
        planner:
            enable_cuda: true
            skip_planning: false

            sensor_range_min: 0.1  # [m]
            sensor_range_max: 8.0 # [m]
            camera_fov_h: 86.0 # [deg]
            camera_fov_v: 58.0 # [deg]

            alpha: 3 # [deg]

            point_max_age: 5.0 # [s]

            goal_dev_margin: 0.2 # [m]
            goal_min_dist: 2.0 # [m]

            max_candidates_per_it: 3
            robot_pos_margin: 0.2 # [m]
            planning_step: 0.5 # [m]

            # cost params
            cost_yaw: 0.5
            cost_velocity: 1.5
            cost_obstacle_distance: 5000.0
            obstacle_distance_min: 2.0
