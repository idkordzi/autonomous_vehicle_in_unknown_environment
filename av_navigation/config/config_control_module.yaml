/av_control_node:
    ros__parameters:
        ros_node:
            subs:
                robot_pose: /robot/ekf/pose
                robot_velocity: /robot/ekf/velocity
                goal_pose: /robot/planner/goal
            pubs:
                robot_velocity: /robot/control/velocity
            thread_freq: 50.0

        controller:
            reg_forward: [1.0, 0.1, 0.1]
            reg_forward_max: 1.0 # [m/s]
            reg_rotate: [1.0, 0.1, 0.1]
            reg_rotate_max: 0.3 # [rad/s]
            max_pos_err_ang_off: 0.1
